<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange サーバーのビルド番号を取得するスクリプト / A Script to Get Exchange Server Build Numbers</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/get-exchange-server-build-number/" : "/Docs/ja/get-exchange-server-build-number/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/get-exchange-server-build-number/">日本語</a></li>
    <li><a href="/Docs/en/get-exchange-server-build-number/">English</a></li>
  </ul>
</body>
</html>
