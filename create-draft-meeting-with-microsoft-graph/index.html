<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Microsoft Graph で下書き状態の会議を作成する / Create a draft meeting with Microsoft Graph</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/create-draft-meeting-with-microsoft-graph/" : "/Docs/ja/create-draft-meeting-with-microsoft-graph/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/create-draft-meeting-with-microsoft-graph/">日本語</a></li>
    <li><a href="/Docs/en/create-draft-meeting-with-microsoft-graph/">English</a></li>
  </ul>
</body>
</html>
