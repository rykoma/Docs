<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>GitHub Copilot と一緒に WordPress から GitHub Pages へブログを移行した話 / Migrating my blog from WordPress to GitHub Pages with GitHub Copilot</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/migrate-wordpress-to-github-pages-with-copilot/" : "/ja/migrate-wordpress-to-github-pages-with-copilot/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/migrate-wordpress-to-github-pages-with-copilot/">日本語</a></li>
    <li><a href="/en/migrate-wordpress-to-github-pages-with-copilot/">English</a></li>
  </ul>
</body>
</html>
