name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enable_cname:
        description: Generate CNAME for custom domain deployment
        required: true
        default: 'false'
      deploy_url:
        description: Base URL to build the site with
        required: true
        default: 'https://rykoma.github.io/Docs'

permissions:
  contents: write

concurrency:
  group: hexo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine deploy URL
        id: deploy_url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.deploy_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://rykoma.github.io/Docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: npx hexo generate --url ${{ steps.deploy_url.outputs.url }}

      - name: Ensure CNAME
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_cname == 'true' }}
        run: echo "blog.rykoma.net" > public/CNAME

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
