<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>PR_ENTRYID を Microsoft Graph の REST ID に変換する / Convert PR_ENTRYID to a Microsoft Graph REST ID</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/convert-pr-entryid-to-microsoft-graph-rest-id/" : "/ja/convert-pr-entryid-to-microsoft-graph-rest-id/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/convert-pr-entryid-to-microsoft-graph-rest-id/">日本語</a></li>
    <li><a href="/en/convert-pr-entryid-to-microsoft-graph-rest-id/">English</a></li>
  </ul>
</body>
</html>
