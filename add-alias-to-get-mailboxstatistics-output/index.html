<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Get-MailboxStatistics コマンドの出力にエイリアスを追加する / Adding an alias to the output of Get-MailboxStatistics</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/add-alias-to-get-mailboxstatistics-output/" : "/Docs/ja/add-alias-to-get-mailboxstatistics-output/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/add-alias-to-get-mailboxstatistics-output/">日本語</a></li>
    <li><a href="/Docs/en/add-alias-to-get-mailboxstatistics-output/">English</a></li>
  </ul>
</body>
</html>
