<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Microsoft 365 でユーザーによるプロフィール写真の変更を禁止する / Prevent users from changing profile photos in Microsoft 365</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/prevent-user-profile-photo-changes-in-microsoft-365/" : "/ja/prevent-user-profile-photo-changes-in-microsoft-365/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/prevent-user-profile-photo-changes-in-microsoft-365/">日本語</a></li>
    <li><a href="/en/prevent-user-profile-photo-changes-in-microsoft-365/">English</a></li>
  </ul>
</body>
</html>
