<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange Server - Developer Messaging 研究所 / Developer Messaging Lab</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/categories/Exchange-Server/" : "/Docs/ja/categories/Exchange-Server/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/categories/Exchange-Server/">日本語</a></li>
    <li><a href="/Docs/en/categories/Exchange-Server/">English</a></li>
  </ul>
</body>
</html>
