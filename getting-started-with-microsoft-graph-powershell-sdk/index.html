<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Microsoft Graph PowerShell SDK の試し方 / Getting started with the Microsoft Graph PowerShell SDK</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/getting-started-with-microsoft-graph-powershell-sdk/" : "/ja/getting-started-with-microsoft-graph-powershell-sdk/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/getting-started-with-microsoft-graph-powershell-sdk/">日本語</a></li>
