<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>DAG 構成の特定のメールボックス サーバーでホストされているメールボックスを正確に取得する / Accurately Get Mailboxes Hosted on a Specific DAG Server</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/get-mailboxes-on-specific-dag-server/" : "/Docs/ja/get-mailboxes-on-specific-dag-server/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/get-mailboxes-on-specific-dag-server/">日本語</a></li>
    <li><a href="/Docs/en/get-mailboxes-on-specific-dag-server/">English</a></li>
  </ul>
</body>
</html>
