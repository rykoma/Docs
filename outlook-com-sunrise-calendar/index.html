<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Outlook.com のカレンダーを Sunrise Calendar で表示する / Viewing your Outlook.com calendar in Sunrise Calendar</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/outlook-com-sunrise-calendar/" : "/Docs/ja/outlook-com-sunrise-calendar/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/outlook-com-sunrise-calendar/">日本語</a></li>
    <li><a href="/Docs/en/outlook-com-sunrise-calendar/">English</a></li>
  </ul>
</body>
</html>
