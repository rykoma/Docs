<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Outlook Add-ins - Developer Messaging 研究所 / Developer Messaging Lab</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/tags/Outlook-Add-ins/" : "/ja/tags/Outlook-Add-ins/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/tags/Outlook-Add-ins/">日本語</a></li>
    <li><a href="/en/tags/Outlook-Add-ins/">English</a></li>
  </ul>
</body>
</html>
