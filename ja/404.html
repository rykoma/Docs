<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ページが見つかりません | rykoma.github.io</title>
  <link rel="shortcut icon" href="/Docs/favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #555;
      background: #eee;
    }
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
      background: linear-gradient(135deg, #21425a, #39718d);
    }
    .site-title {
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 1px;
      text-decoration: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .site-title:hover,
    .site-title:focus-visible {
      text-decoration: underline;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .not-found-code {
      margin: 0;
      font-size: 4.5rem;
      font-weight: 700;
      color: #21425a;
      letter-spacing: 2px;
    }
    .not-found-message {
      margin: 0.5rem 0 1.5rem;
      font-size: 1.1rem;
    }
    .not-found-link {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border-radius: 4px;
      background: #258fb8;
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
    }
    .not-found-link:hover,
    .not-found-link:focus-visible {
      background: #1d7194;
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="/Docs/ja/">Developer Messaging 研究所</a>
  </header>
  <main>
    <p class="not-found-code">404</p>
    <p class="not-found-message">ページが見つかりません。</p>
    <a class="not-found-link" href="/Docs/ja/">トップページへ戻る</a>
  </main>
</body>
</html>
