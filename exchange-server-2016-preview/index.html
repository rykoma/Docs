<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange Server 2016 Preview / Exchange Server 2016 Preview</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/exchange-server-2016-preview/" : "/ja/exchange-server-2016-preview/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/exchange-server-2016-preview/">日本語</a></li>
    <li><a href="/en/exchange-server-2016-preview/">English</a></li>
  </ul>
</body>
</html>
