<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange Online への PowerShell 接続を非対話的に行う方法 / Connect to Exchange Online PowerShell Non-Interactively</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/non-interactive-exchange-online-powershell-connection/" : "/ja/non-interactive-exchange-online-powershell-connection/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/non-interactive-exchange-online-powershell-connection/">日本語</a></li>
    <li><a href="/en/non-interactive-exchange-online-powershell-connection/">English</a></li>
  </ul>
</body>
</html>
