<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>テナントに登録されている EWS アプリを探す / Find EWS apps registered in a tenant</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/find-ews-applications-in-tenant/" : "/ja/find-ews-applications-in-tenant/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/find-ews-applications-in-tenant/">日本語</a></li>
    <li><a href="/en/find-ews-applications-in-tenant/">English</a></li>
  </ul>
</body>
</html>
