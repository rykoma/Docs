<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Microsoft Graph PowerShell SDK の特定のモジュールのみを利用する / Use only specific Microsoft Graph PowerShell SDK modules</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/use-specific-microsoft-graph-powershell-sdk-modules/" : "/ja/use-specific-microsoft-graph-powershell-sdk-modules/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/use-specific-microsoft-graph-powershell-sdk-modules/">日本語</a></li>
    <li><a href="/en/use-specific-microsoft-graph-powershell-sdk-modules/">English</a></li>
  </ul>
</body>
</html>
