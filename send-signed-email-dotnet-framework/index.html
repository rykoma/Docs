<head>

  <title>.NET Framework で電子署名付きのメールを送信する / Sending a digitally signed email from .NET Framework</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/send-signed-email-dotnet-framework/" : "/Docs/ja/send-signed-email-dotnet-framework/";
      window.location.replace(destination);
    })();
  </script>
</head>

  <ul>
    <li><a href="/Docs/ja/send-signed-email-dotnet-framework/">日本語</a></li>
