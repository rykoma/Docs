<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Role Based Access Control for Applications を使用してアプリが接続可能なメールボックスを制御する / Control which mailboxes an app can access with Role Based Access Control for Applications</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/control-application-mailbox-access-with-rbac/" : "/ja/control-application-mailbox-access-with-rbac/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/control-application-mailbox-access-with-rbac/">日本語</a></li>
    <li><a href="/en/control-application-mailbox-access-with-rbac/">English</a></li>
  </ul>
</body>
</html>
