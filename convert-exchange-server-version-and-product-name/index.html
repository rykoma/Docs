<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange サーバーのバージョン番号と製品名を相互変換する / Convert Between Exchange Server Version Numbers and Product Names</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/convert-exchange-server-version-and-product-name/" : "/Docs/ja/convert-exchange-server-version-and-product-name/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/convert-exchange-server-version-and-product-name/">日本語</a></li>
    <li><a href="/Docs/en/convert-exchange-server-version-and-product-name/">English</a></li>
  </ul>
</body>
</html>
