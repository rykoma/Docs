<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Format-List コマンドの結果をプロパティの名前でならべかえる / Sort Format-List Output by Property Name</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/sort-format-list-output-by-property-name/" : "/Docs/ja/sort-format-list-output-by-property-name/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/sort-format-list-output-by-property-name/">日本語</a></li>
    <li><a href="/Docs/en/sort-format-list-output-by-property-name/">English</a></li>
  </ul>
</body>
</html>
