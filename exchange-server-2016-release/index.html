<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Exchange Server 2016 リリース / Exchange Server 2016 Released</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/exchange-server-2016-release/" : "/Docs/ja/exchange-server-2016-release/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/exchange-server-2016-release/">日本語</a></li>
    <li><a href="/Docs/en/exchange-server-2016-release/">English</a></li>
  </ul>
</body>
</html>
