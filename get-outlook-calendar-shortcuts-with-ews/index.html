<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Outlook や OWA の予定表ショートカットを EWS で取得する / Get Outlook calendar shortcuts with EWS</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/Docs/en/get-outlook-calendar-shortcuts-with-ews/" : "/Docs/ja/get-outlook-calendar-shortcuts-with-ews/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/Docs/ja/get-outlook-calendar-shortcuts-with-ews/">日本語</a></li>
    <li><a href="/Docs/en/get-outlook-calendar-shortcuts-with-ews/">English</a></li>
  </ul>
</body>
</html>
