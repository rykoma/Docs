<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Power Automate で Microsoft Graph reports API を利用する / Use the Microsoft Graph reports API with Power Automate</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/use-microsoft-graph-reports-api-with-power-automate/" : "/ja/use-microsoft-graph-reports-api-with-power-automate/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/use-microsoft-graph-reports-api-with-power-automate/">日本語</a></li>
    <li><a href="/en/use-microsoft-graph-reports-api-with-power-automate/">English</a></li>
  </ul>
</body>
</html>
