<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Microsoft Graph で会議の別の時間を提案する / Propose an alternative meeting time with Microsoft Graph</title>
  <script>
    (() => {
      const languages = navigator.languages || [navigator.language];
      const language = languages.find((value) => /^(ja|en)(-|$)/i.test(value));
      const destination = language && /^en/i.test(language) ? "/en/propose-alternative-meeting-time-with-microsoft-graph/" : "/ja/propose-alternative-meeting-time-with-microsoft-graph/";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Select a language:</p>
  <ul>
    <li><a href="/ja/propose-alternative-meeting-time-with-microsoft-graph/">日本語</a></li>
    <li><a href="/en/propose-alternative-meeting-time-with-microsoft-graph/">English</a></li>
  </ul>
</body>
</html>
